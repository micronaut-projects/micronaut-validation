plugins { id 'java' }
sourceSets {
    nativeSmoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    nativeSmokeImplementation.extendsFrom implementation
    nativeSmokeRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    nativeSmokeAnnotationProcessor projects.micronautValidationProcessor
    nativeSmokeAnnotationProcessor mn.micronaut.inject.java
}
def image = layout.buildDirectory.file('native-smoke/validation-smoke')
def graalHome = providers.environmentVariable('GRAALVM_HOME')
tasks.register('nativeSmokeBuild', Exec) {
    group = 'verification'
    description = 'Builds the generated-access native smoke test; requires GRAALVM_HOME.'
    dependsOn tasks.named('nativeSmokeClasses')
    inputs.files(sourceSets.nativeSmoke.runtimeClasspath)
    outputs.file(image)
    doFirst {
        if (!graalHome.isPresent()) { throw new GradleException('Set GRAALVM_HOME to a GraalVM JDK with native-image to run nativeSmoke.') }
        image.get().asFile.parentFile.mkdirs()
        commandLine "${graalHome.get()}/bin/native-image", '-J-Xmx4g', '--parallelism=2', '--no-fallback',
            '-cp', sourceSets.nativeSmoke.runtimeClasspath.asPath, '-o', image.get().asFile.absolutePath,
            'io.micronaut.validation.nativeimage.ValidationNativeSmoke'
    }
}
tasks.register('nativeSmoke', Exec) {
    group = 'verification'
    description = 'Runs the native smoke test for generated access and rejection of private-field reflection.'
    dependsOn tasks.named('nativeSmokeBuild')
    doFirst { commandLine image.get().asFile.absolutePath }
}
