plugins {
    id 'io.micronaut.build.internal.validation-module'
}
tasks.register('compileEnforcementFixtureProcessor', JavaCompile) {
    source = fileTree('src/compilerNegative/processor') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('compilerNegative/processor')
    javaCompiler = tasks.named('compileJava', JavaCompile).flatMap { it.javaCompiler }
    options.compilerArgs.add('-proc:none')
}

def compilerNegativeTasks = [Reflection: 'NoReflection', HiddenReflection: 'NoReflection', Nullness: 'NullAway', Generated: 'NoReflection', GeneratedNullness: 'NullAway'].collect { fixture, diagnostic ->
    def taskName = "compileCompiler${fixture}Negative"
    noReflection.checkedTasks.add(taskName)
    tasks.register(taskName, JavaCompile) {
        group = 'verification'
        description = "Proves the ${diagnostic} production compiler gate rejects ${fixture.toLowerCase()} violations."
        source = fileTree("src/compilerNegative/${fixture.startsWith('Generated') ? 'generated' : fixture.toLowerCase()}") { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = layout.buildDirectory.dir("compilerNegative/${fixture}")
        javaCompiler = tasks.named('compileJava', JavaCompile).flatMap { it.javaCompiler }
        if (fixture.startsWith('Generated')) {
            dependsOn tasks.named('compileEnforcementFixtureProcessor')
            options.annotationProcessorPath = configurations.annotationProcessor + files(layout.buildDirectory.dir('compilerNegative/processor'))
            options.compilerArgs.addAll(['-processor', 'io.micronaut.validation.fixture.ForbiddenProcessor',
                "-AfixtureNullness=${fixture == 'GeneratedNullness'}"])
        } else {
            options.annotationProcessorPath = configurations.annotationProcessor
        }
        options.failOnError = false
        options.incremental = false
        options.errorprone.option('NullAway:AnnotatedPackages', 'io.micronaut')
        def diagnostics = new StringBuilder()
        logging.addStandardErrorListener { diagnostics.append(it) }
        outputs.upToDateWhen { false }
        doFirst {
            delete(destinationDirectory)
            diagnostics.setLength(0)
        }
        doLast {
            if (!diagnostics.toString().contains("[${diagnostic}]")) {
                throw new GradleException("Expected ${diagnostic} compiler rejection; received: ${diagnostics}")
            }
            if (!fixture.startsWith('Generated') && !fileTree(destinationDirectory).matching { include '**/*.class' }.isEmpty()) {
                throw new GradleException("Compiler accepted the deliberately invalid ${fixture} fixture")
            }
            if (fixture.startsWith('Generated') && !fileTree(destinationDirectory).matching { include '**/ForbiddenGenerated*.class' }.isEmpty()) {
                throw new GradleException("Compiler accepted a forbidden generated class")
            }
        }
    }
}
tasks.register('compilerEnforcementTest') {
    group = 'verification'
    dependsOn(compilerNegativeTasks)
}
tasks.named('check') { dependsOn('compilerEnforcementTest') }
