plugins {
    id 'io.micronaut.build.internal.validation-base'
    id "io.micronaut.build.internal.module"
    id 'io.micronaut.errorprone.no-reflection'
}

// NullAway through the Micronaut build convention: NullAway and MissingOverride as errors over io.micronaut, in the
// NullAway version the catalog names
micronautBuild {
    nullAway = true
}

// Where reflection may be called from, checked as the main sources compile: the NoReflection check of
// micronaut-errorprone-no-reflection. The noReflection block of each module names the classes allowed to, and for
// what; a class named there is a decision to make deliberately
tasks.withType(JavaCompile).configureEach {
    // the main sources only, with the checks named here and by the NullAway convention and none of ErrorProne's own
    options.errorprone.enabled = name == 'compileJava' || name.startsWith('compileCompiler')
    options.errorprone.disableAllChecks = true
    if (name == "compileJava" || name.startsWith("compileCompiler")) {
        options.errorprone.error("NoReflection", "NullAway")
    }
}

dependencies {
    testRuntimeOnly(libs.junit.platform.launcher)
}

noReflection {
    forbidAll()
    severity "ERROR"
    // reflection reached through Micronaut core rather than java.lang.reflect: what synthesizes an annotation
    // or looks a member up at runtime. Every module but micronaut-validation-reflection goes without them, so
    // that reflection is used only where that module is on the classpath
    forbid("io.micronaut.inject.annotation.AnnotationMetadataSupport#buildAnnotation")
    forbid("io.micronaut.core.annotation.AnnotationSource#synthesize")
    forbid("io.micronaut.core.annotation.AnnotationSource#synthesizeAll")
    forbid("io.micronaut.core.annotation.AnnotationSource#synthesizeDeclared")
    forbid("io.micronaut.core.reflect.ReflectionUtils#getRequiredMethod")
    forbid("io.micronaut.core.reflect.ReflectionUtils#getRequiredField")
    forbid("io.micronaut.inject.MethodReference#getTargetMethod")
    forbid("io.micronaut.inject.ExecutableMethod#getTargetMethod")
    forbid("io.micronaut.core.reflect.ClassUtils#forName")
    forbid("io.micronaut.core.reflect.InstantiationUtils#instantiate")
    forbid("io.micronaut.core.reflect.InstantiationUtils#tryInstantiate")
}
