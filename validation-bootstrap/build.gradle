plugins {
    id "io.micronaut.build.internal.validation-module"
}

dependencies {
    annotationProcessor mn.micronaut.inject.java

    api projects.micronautValidation
    // the bootstrap validates the types of an application that never ran the processors: it describes them reflectively
    api projects.micronautValidationReflection

    testAnnotationProcessor mn.micronaut.inject.java
    testImplementation mn.micronaut.inject.java.test
    testImplementation mnTest.micronaut.test.junit5
    testRuntimeOnly mnTest.junit.jupiter.engine
}

noReflection {
    // the Jakarta bootstrap: providers and value extractors registered as services, the XML module and the EL
    // interpolator when they are present, and the classes validation.xml names
    allowIn("io.micronaut.validation.bootstrap.MicronautValidatorConfiguration", "SERVICE_LOADING", "CLASS_LOADING", "CLASS_MEMBERS", "REFLECTIVE_ACCESS")
}

micronautBuild {
    binaryCompatibility {
        enabledAfter("5.2.0")
    }
}
