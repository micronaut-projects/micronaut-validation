plugins {
    id 'io.micronaut.build.internal.validation-module'
}

// Generated annotations implement internal contracts from validation; the default module supplies
// those contracts at runtime. A compile-only dependency avoids a publication dependency cycle.
dependencies {
    compileOnly projects.micronautValidation
    testImplementation projects.micronautValidation
    testImplementation mnTest.junit.jupiter.api
    testRuntimeOnly mnTest.junit.jupiter.engine
    annotationProcessor mn.micronaut.inject.java
    annotationProcessor(projects.micronautValidationProcessor) {
        exclude module: 'micronaut-validation-metadata'
    }
}

micronautBuild {
    binaryCompatibility {
        enabledAfter("5.3.0")
    }
}
