plugins {
    id "io.micronaut.build.internal.validation-module"
    alias(libs.plugins.jmh)
}

dependencies {
    annotationProcessor mn.micronaut.inject.java

    compileOnly mn.micronaut.http.server
    compileOnly libs.jakarta.el.api

    api mn.micronaut.inject
    api mn.micronaut.core.reactive
    api libs.managed.validation

    implementation mnReactor.micronaut.reactor

    testAnnotationProcessor projects.micronautValidationProcessor
    testAnnotationProcessor mn.micronaut.inject.java

    testCompileOnly mn.micronaut.inject.groovy

    testImplementation projects.micronautValidationProcessor
    testImplementation libs.spotbugs
    testImplementation mn.micronaut.inject

    testImplementation mn.micronaut.http.client
    testImplementation mn.micronaut.http.server.netty
    testImplementation mnRxjava3.micronaut.rxjava3
    testImplementation(platform(mn.boms.groovy))
    testImplementation(libs.groovy.json)
    testImplementation mn.micronaut.inject.java.test
    testImplementation mn.micronaut.jackson.databind

    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(libs.junit.platform.launcher)

    jmhAnnotationProcessor(libs.jmh.generator.annprocess)
    jmhAnnotationProcessor(projects.micronautValidationProcessor)
    jmhAnnotationProcessor(mn.micronaut.inject.java)
    jmh(libs.jmh.core)
}

// The Jakarta EL interpolator replaces the default one as soon as an EL implementation is on the class
// path, which is what an application asking for it wants and what the tests of the module must not have.
// Its test runs in a source set of its own, with the implementation and the user bundle it reads.
sourceSets {
    elTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    elTestImplementation.extendsFrom(implementation)
    elTestRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    elTestImplementation libs.jakarta.el.api
    elTestImplementation(mnTest.micronaut.test.junit5)
    elTestRuntimeOnly libs.micronaut.expression.language
    elTestRuntimeOnly libs.micronaut.expression.language.interpreter
    elTestRuntimeOnly(mnTest.junit.jupiter.engine)
    elTestRuntimeOnly(libs.junit.platform.launcher)
}

def elTest = tasks.register("elTest", Test) {
    group = 'verification'
    description = "Runs the tests of the Jakarta EL message interpolator, with an EL implementation present."
    testClassesDirs = sourceSets.elTest.output.classesDirs
    classpath = sourceSets.elTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter(tasks.named("test"))
}

tasks.named("check") {
    dependsOn(elTest)
}

noReflection {
    // the interceptor hands the validator the method the framework invokes, which the API names by its Method,
    // and a ParameterNameProvider of the application is asked by Method too
    allowIn("io.micronaut.validation.ValidatingInterceptor", "TARGET_MEMBERS")
    allowIn("io.micronaut.validation.validator.DefaultValidator", "TARGET_MEMBERS", "INTERFACES", "CLASS_NAMES")
    // the ValidationMessages bundle of the application
    allowIn("io.micronaut.validation.el.ElMessageInterpolator", "CLASS_LOADING")
    // constraint validators registered as services, and the reflection module found as one
    allowIn("io.micronaut.validation.validator.DefaultAnnotatedElementValidator", "SERVICE_LOADING")
    allowIn("io.micronaut.validation.validator.ReflectionSupport", "SERVICE_LOADING")
    // the interfaces a type implements: constraint inheritance, method hierarchies, group inheritance
    allowIn("io.micronaut.validation.validator.ValidatorDeclarations", "INTERFACES")
    allowIn("io.micronaut.validation.validator.ExecutableHierarchy", "INTERFACES")
    allowIn("io.micronaut.validation.validator.DefaultConstraintValidatorContext", "INTERFACES")
    // a path names a constructor node by the simple name of its class
    allowIn("io.micronaut.validation.validator.IntrospectedExecutableDescriptors", "CLASS_NAMES")
    // the structure of a generic signature the API hands over as a Type
    allowIn("io.micronaut.validation.validator.GenericArguments", "GENERIC_SIGNATURES")
    // a constraint type the metadata names, loaded by the class loader asking
    allowIn("io.micronaut.validation.validator.constraints.ConstraintContainers", "CLASS_LOADING")
    allowIn("io.micronaut.validation.validator.DefaultConstraintDescriptor", "CLASS_LOADING", "ENUM_CONSTANTS")
    // sets of the ValidationTarget and MethodType constants of the API
    allowIn("io.micronaut.validation.validator.constraints.ConstraintValidatorTargetResolver", "ENUM_CONSTANTS")
    allowIn("io.micronaut.validation.validator.IntrospectedBeanDescriptor", "ENUM_CONSTANTS")
    // the constants of the enum a constraint names
    allowIn("io.micronaut.validation.validator.constraints.InEnumValidator", "ENUM_CONSTANTS")
    allowIn("io.micronaut.validation.validator.constraints.NotInEnumValidator", "ENUM_CONSTANTS")
    // the elements of an array of any component type, primitive ones included
    allowIn("io.micronaut.validation.validator.constraints.UniqueElementsValidator", "REFLECTIVE_ACCESS")
}

spotless {
    java {
        targetExclude '**/io/micronaut/validation/validator/constraints/EmailValidator.java'
    }
}

tasks.getByName("checkstyleJmh").configure {
    enabled = false
}

