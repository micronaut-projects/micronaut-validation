plugins {
    id "java-library"
    id "io.micronaut.build.internal.validation-base"
}

dependencies {
    implementation mn.micronaut.inject.java
    implementation mn.micronaut.inject
    implementation mn.micronaut.aop
    implementation mn.micronaut.context

    implementation projects.micronautValidation
    implementation projects.micronautValidationProcessor

    implementation libs.arquillian.container
    implementation libs.jakarta.validation.tck.tests

    runtimeOnly(mnLogging.logback.classic)

    testImplementation(libs.jakarta.validation.tck.tests) {
        artifact {
            classifier = "sources"
        }
    }

    testImplementation libs.javax.annotation.api
}

def jakartaTckRuntimeClasspath = configurations.create("jakartaTckRuntimeClasspath") {
    canBeConsumed = false
    canBeResolved = true
    extendsFrom(configurations.testRuntimeClasspath)
}

dependencies {
    add("jakartaTckRuntimeClasspath", projects.micronautValidationJakarta)
}

def methodsTest1 = tasks.register('methodsTest1', Test) {
    scanForTestClasses false
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-methods2.xml")
    }
}

def methodsTest2 = tasks.register('methodsTest2', Test) {
    scanForTestClasses false
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-methods.xml")
    }
}

test {
    description = "Runs the Jakarta Validation TCK core profile against micronaut-validation."
    scanForTestClasses false
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-tests.xml")
    }
    // Methods tests are extracted to prevent flaky tests caused by class loading issues
    dependsOn(methodsTest2)
    dependsOn(methodsTest1)
}

tasks.register('coreTck') {
    group = 'verification'
    description = "Runs the Jakarta Validation TCK core profile."
    dependsOn(test)
}

def jakartaTck = tasks.register('jakartaTck', Test) {
    group = 'verification'
    description = "Runs the Jakarta Validation TCK compliance profile with the micronaut-validation-jakarta aggregate."
    scanForTestClasses false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath
    shouldRunAfter(test)
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.bootstrap.MicronautValidationProvider'
        ]
        suites file("tck-spec-tests.xml")
    }
}

tasks.register('specTck') {
    group = 'verification'
    description = "Compatibility alias for jakartaTck."
    dependsOn(jakartaTck)
}

def failingJakartaTck = tasks.register('failingJakartaTck', Test) {
    group = 'verification'
    description = "Runs the tracked known failing Jakarta Validation TCK tests against the compliance profile."
    scanForTestClasses false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath
    shouldRunAfter(jakartaTck)
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.bootstrap.MicronautValidationProvider'
        ]
        suites file("failingTests.xml")
    }
}

tasks.register('failingSpecTck') {
    group = 'verification'
    description = "Compatibility alias for failingJakartaTck."
    dependsOn(failingJakartaTck)
}

def registerSingleTckTask = { String taskName, String descriptionText, FileCollection runtimeClasspath, String validationProvider ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = descriptionText
        scanForTestClasses false
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = runtimeClasspath

        def suiteFile = layout.buildDirectory.file("generated-testng/${taskName}.xml")
        def testClass = providers.gradleProperty("tckSingleClass")
            .orElse("org.hibernate.beanvalidation.tck.tests.bootstrap.CustomMessageInterpolatorTest")
        def testMethod = providers.gradleProperty("tckSingleMethod")

        inputs.property("tckSingleClass", testClass)
        inputs.property("tckSingleMethod", testMethod.orElse(""))
        outputs.file(suiteFile)

        doFirst {
            def file = suiteFile.get().asFile
            file.parentFile.mkdirs()
            def methodFilter = testMethod.present ? """
                    <methods>
                        <include name="${testMethod.get()}"/>
                    </methods>
            """.stripIndent() : ""
            file.text = """
                <!DOCTYPE suite SYSTEM "http://testng.org/testng-1.0.dtd" >
                <suite name="Jakarta-Bean-Validation-TCK Single" verbose="1">
                    <test name="Jakarta-Bean-Validation-TCK Single">
                        <classes>
                            <class name="${testClass.get()}">
                ${methodFilter}
                            </class>
                        </classes>
                    </test>
                </suite>
            """.stripIndent()
        }

        useTestNG {
            systemProperties = [
                    'validation.provider': validationProvider
            ]
            suites suiteFile.get().asFile
        }
    }
}

def singleCoreTck = registerSingleTckTask(
    'singleCoreTck',
    'Runs one Jakarta Validation TCK class or method against the core profile. Use -PtckSingleClass=... and optional -PtckSingleMethod=...',
    sourceSets.test.runtimeClasspath,
    'io.micronaut.validation.tck.runtime.TckValidationProvider'
)

def singleJakartaTck = registerSingleTckTask(
    'singleJakartaTck',
    'Runs one Jakarta Validation TCK class or method against the compliance profile. Use -PtckSingleClass=... and optional -PtckSingleMethod=...',
    sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath,
    'io.micronaut.validation.bootstrap.MicronautValidationProvider'
)

tasks.register('singleSpecTck') {
    group = 'verification'
    description = 'Compatibility alias for singleJakartaTck.'
    dependsOn(singleJakartaTck)
}

tasks.register('singleTest') {
    group = 'verification'
    description = 'Compatibility alias for singleCoreTck.'
    dependsOn(singleCoreTck)
}
