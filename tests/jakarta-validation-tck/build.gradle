plugins {
    id "java-library"
    id "jacoco"
    id "io.micronaut.build.internal.validation-base"
}

def javaFxClassifier = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty("os.arch")
    if (os.isMacOsX()) {
        return arch == "aarch64" ? "mac-aarch64" : "mac"
    }
    if (os.isLinux()) {
        return arch == "aarch64" ? "linux-aarch64" : "linux"
    }
    if (os.isWindows()) {
        return "win"
    }
    throw new GradleException("Unsupported JavaFX platform for ${os} ${arch}")
}

def javaFxBaseDependency = dependencies.create(group: "org.openjfx", name: "javafx-base", version: libs.versions.javafx.get(), classifier: javaFxClassifier())
def tckArchiveClasspath = configurations.create("tckArchiveClasspath") {
    canBeConsumed = false
    canBeResolved = true
}

dependencies {
    implementation mn.micronaut.inject.java
    implementation mn.micronaut.inject
    implementation mn.micronaut.aop
    implementation mn.micronaut.context

    implementation projects.micronautValidation
    implementation projects.micronautValidationProcessor

    implementation libs.arquillian.container
    implementation libs.jakarta.cdi.api
    implementation libs.jakarta.ejb.api
    implementation libs.jakarta.validation.tck.tests

    runtimeOnly(mnLogging.logback.classic)

    testImplementation(libs.jakarta.validation.tck.tests) {
        artifact {
            classifier = "sources"
        }
    }
    testCompileOnly javaFxBaseDependency
    add("tckArchiveClasspath", javaFxBaseDependency)

    testImplementation libs.javax.annotation.api
}

def jakartaTckRuntimeClasspath = configurations.create("jakartaTckRuntimeClasspath") {
    canBeConsumed = false
    canBeResolved = true
    extendsFrom(configurations.testRuntimeClasspath)
}

dependencies {
    add("jakartaTckRuntimeClasspath", projects.micronautValidationJakarta)
}

def methodsTest1 = tasks.register('methodsTest1', Test) {
    scanForTestClasses false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-methods2.xml")
    }
}

def methodsTest2 = tasks.register('methodsTest2', Test) {
    scanForTestClasses false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-methods.xml")
    }
}

test {
    description = "Runs the Jakarta Validation TCK core profile against micronaut-validation."
    scanForTestClasses false
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.tck.runtime.TckValidationProvider'
        ]
        suites file("tck-tests.xml")
    }
    // Methods tests are extracted to prevent flaky tests caused by class loading issues
    dependsOn(methodsTest2)
    dependsOn(methodsTest1)
}

tasks.register('coreTck') {
    group = 'verification'
    description = "Runs the Jakarta Validation TCK core profile."
    dependsOn(test)
}

def tckHarnessTest = tasks.register('tckHarnessTest', Test) {
    group = 'verification'
    description = "Runs focused unit tests for the local Jakarta Validation TCK harness."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG()
    include 'io/micronaut/validation/tck/**/*Test.class'
}

def jakartaTck = tasks.register('jakartaTck', Test) {
    group = 'verification'
    description = "Runs the Jakarta Validation TCK compliance profile with the micronaut-validation-jakarta aggregate."
    scanForTestClasses false
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath + tckArchiveClasspath
    shouldRunAfter(test)
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.bootstrap.MicronautValidationProvider'
        ]
        suites file("tck-spec-tests.xml")
    }
}

tasks.named("check") {
    dependsOn(tckHarnessTest)
    dependsOn(jakartaTck)
}

def writeFailingJakartaTckSuite = { File resultsDir, File suiteFile ->
    if (!resultsDir.directory) {
        throw new GradleException("No Jakarta TCK test results found at ${resultsDir}. Run discoverFailingJakartaTck first.")
    }

    def resultFiles = fileTree(resultsDir) {
        include 'TEST-*.xml'
    }.files
    if (resultFiles.empty) {
        throw new GradleException("No Jakarta TCK XML test result files found at ${resultsDir}.")
    }

    def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
    documentBuilderFactory.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
    documentBuilderFactory.setFeature("http://xml.org/sax/features/external-general-entities", false)
    documentBuilderFactory.setFeature("http://xml.org/sax/features/external-parameter-entities", false)
    documentBuilderFactory.setXIncludeAware(false)
    documentBuilderFactory.setExpandEntityReferences(false)

    def classLevelFailures = new TreeSet<String>()
    def methodFailures = new TreeMap<String, TreeSet<String>>()
    def configurationFailure = { String methodName ->
        methodName == null || methodName.empty || methodName.startsWith('arquillian') || methodName == 'initializationError'
    }
    resultFiles.each { resultFile ->
        def document = documentBuilderFactory.newDocumentBuilder().parse(resultFile)
        def testcases = document.getElementsByTagName('testcase')
        for (int i = 0; i < testcases.length; i++) {
            def testcase = testcases.item(i)
            if (testcase.getElementsByTagName('failure').length == 0 && testcase.getElementsByTagName('error').length == 0) {
                continue
            }
            def className = testcase.getAttribute('classname')
            def methodName = testcase.getAttribute('name')
            if (configurationFailure(methodName)) {
                classLevelFailures.add(className)
                methodFailures.remove(className)
            } else if (!classLevelFailures.contains(className)) {
                def methods = methodFailures[className]
                if (methods == null) {
                    methods = new TreeSet<String>()
                    methodFailures[className] = methods
                }
                methods.add(methodName)
            }
        }
    }

    def passingWaves = []
    if (suiteFile.file) {
        def inPassingWaves = false
        suiteFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed == 'Passing waves already removed from this tracker:') {
                inPassingWaves = true
            } else if (inPassingWaves && trimmed.startsWith('- ')) {
                passingWaves.add(trimmed.substring(2))
            } else if (inPassingWaves && trimmed == '-->') {
                inPassingWaves = false
            }
        }
    }

    def escapeXml = { String value ->
        value.replace('&', '&amp;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
            .replace('"', '&quot;')
            .replace("'", '&apos;')
    }
    def allClasses = new TreeSet<String>()
    allClasses.addAll(methodFailures.keySet())
    allClasses.addAll(classLevelFailures)
    def methodCount = methodFailures.values().sum(0) { it.size() }

    suiteFile.parentFile.mkdirs()
    def builder = new StringBuilder()
    builder << '<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd" >\n\n'
    builder << '<suite name="Jakarta-Bean-Validation-TCK Known Failures" verbose="1" configfailurepolicy="continue">\n'
    builder << '    <!--\n'
    builder << '        Jakarta compliance TCK progress tracker.\n\n'
    builder << '        Keep this suite focused on tests that are known to fail in the Jakarta\n'
    builder << '        compliance profile.\n'
    builder << '        When a class or method passes, remove it from this file in the same focused\n'
    builder << '        commit as the implementation change.\n\n'
    builder << '        Entries are discovered from a full TCK run. If an entry passes in this\n'
    builder << '        smaller suite because of ordering or isolation differences, keep it here\n'
    builder << '        until a refreshed full discovery run stops reporting it.\n\n'
    builder << '        Failing entries below were generated from\n'
    builder << "        ${project.relativePath(resultsDir)} and should be refreshed with:\n"
    builder << "        ./gradlew ${path}:discoverFailingJakartaTck\n\n"
    builder << "        Current tracker shape: ${allClasses.size()} classes, ${methodCount} methods,\n"
    builder << "        and ${classLevelFailures.size()} class-level setup failures.\n"
    if (!passingWaves.empty) {
        builder << '\n'
        builder << '        Passing waves already removed from this tracker:\n'
        passingWaves.each { passingWave ->
            builder << "        - ${passingWave}\n"
        }
    }
    builder << '    -->\n'
    builder << '    <test name="Known Failing Jakarta TCK Tests">\n'
    builder << '        <classes>\n'
    allClasses.each { className ->
        if (classLevelFailures.contains(className)) {
            builder << "            <class name=\"${escapeXml(className)}\"/>\n"
        } else {
            builder << "            <class name=\"${escapeXml(className)}\">\n"
            builder << '                <methods>\n'
            methodFailures[className].each { methodName ->
                builder << "                    <include name=\"${escapeXml(methodName)}\"/>\n"
            }
            builder << '                </methods>\n'
            builder << '            </class>\n'
        }
    }
    builder << '        </classes>\n'
    builder << '    </test>\n'
    builder << '</suite>\n'
    suiteFile.text = builder.toString()
    logger.lifecycle("Wrote ${suiteFile} with ${allClasses.size()} classes, ${methodCount} methods, and ${classLevelFailures.size()} class-level setup failures.")
}

def refreshFailingJakartaTckSuite = tasks.register('refreshFailingJakartaTckSuite') {
    group = 'verification'
    description = "Regenerates failingTests.xml from the latest discoverFailingJakartaTck XML results."

    def resultsDir = layout.buildDirectory.dir("test-results/discoverFailingJakartaTck")
    inputs.dir(resultsDir)
    outputs.file(file("failingTests.xml"))

    doLast {
        writeFailingJakartaTckSuite(resultsDir.get().asFile, file("failingTests.xml"))
    }
}

def discoverFailingJakartaTck = tasks.register('discoverFailingJakartaTck', Test) {
    group = 'verification'
    description = "Runs the full Jakarta Validation TCK compliance profile and refreshes failingTests.xml from the failures."
    scanForTestClasses false
    ignoreFailures true
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath + tckArchiveClasspath
    shouldRunAfter(jakartaTck)
    outputs.upToDateWhen { false }
    finalizedBy(refreshFailingJakartaTckSuite)
    useTestNG {
        systemProperties = [
                'validation.provider': 'io.micronaut.validation.bootstrap.MicronautValidationProvider'
        ]
        suites file("tck-spec-tests.xml")
    }
}

tasks.register('specTck') {
    group = 'verification'
    description = "Compatibility alias for jakartaTck."
    dependsOn(jakartaTck)
}

