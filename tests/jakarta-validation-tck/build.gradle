def registerSingleTckTask = { String taskName, String descriptionText, FileCollection runtimeClasspath, String validationProvider ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = descriptionText
        scanForTestClasses false
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = runtimeClasspath

        def suiteFile = layout.buildDirectory.file("generated-testng/${taskName}.xml")
        def testClass = providers.gradleProperty("tckSingleClass")
            .orElse("org.hibernate.beanvalidation.tck.tests.bootstrap.CustomMessageInterpolatorTest")
        def testMethod = providers.gradleProperty("tckSingleMethod")

        inputs.property("tckSingleClass", testClass)
        inputs.property("tckSingleMethod", testMethod.orElse(""))
        outputs.file(suiteFile)

        doFirst {
            def file = suiteFile.get().asFile
            file.parentFile.mkdirs()
            def methodFilter = testMethod.present ? """
                    <methods>
                        <include name="${testMethod.get()}"/>
                    </methods>
            """.stripIndent() : ""
            file.text = """
                <!DOCTYPE suite SYSTEM "http://testng.org/testng-1.0.dtd" >
                <suite name="Jakarta-Bean-Validation-TCK Single" verbose="1">
                    <test name="Jakarta-Bean-Validation-TCK Single">
                        <classes>
                            <class name="${testClass.get()}">
                ${methodFilter}
                            </class>
                        </classes>
                    </test>
                </suite>
            """.stripIndent()
        }

        useTestNG {
            systemProperties = [
                    'validation.provider': validationProvider
            ]
            suites suiteFile.get().asFile
        }
    }
}

def singleCoreTck = registerSingleTckTask(
    'singleCoreTck',
    'Runs one Jakarta Validation TCK class or method against the core profile. Use -PtckSingleClass=... and optional -PtckSingleMethod=...',
    sourceSets.test.runtimeClasspath,
    'io.micronaut.validation.tck.runtime.TckValidationProvider'
)

def singleJakartaTck = registerSingleTckTask(
    'singleJakartaTck',
    'Runs one Jakarta Validation TCK class or method against the compliance profile. Use -PtckSingleClass=... and optional -PtckSingleMethod=...',
    sourceSets.test.runtimeClasspath + jakartaTckRuntimeClasspath + tckArchiveClasspath,
    'io.micronaut.validation.bootstrap.MicronautValidationProvider'
)

[jakartaTck, discoverFailingJakartaTck, failingJakartaTck, singleJakartaTck].each { taskProvider ->
    taskProvider.configure {
        doFirst {
            systemProperty 'micronaut.validation.tck.archive.classpath', tckArchiveClasspath.asPath
        }
    }
}

tasks.register('singleSpecTck') {
    group = 'verification'
    description = 'Compatibility alias for singleJakartaTck.'
    dependsOn(singleJakartaTck)
}

tasks.register('singleTest') {
    group = 'verification'
    description = 'Compatibility alias for singleCoreTck.'
    dependsOn(singleCoreTck)
}

def jakartaCoverageProjects = [
    project(':micronaut-validation'),
    project(':micronaut-validation-bootstrap'),
    project(':micronaut-validation-el'),
    project(':micronaut-validation-jakarta'),
    project(':micronaut-validation-reflection'),
    project(':micronaut-validation-xml')
]

def jakartaCoverageReport = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')

jakartaCoverageProjects.each { coveredProject ->
    coveredProject.plugins.withId('org.sonarqube') {
        coveredProject.sonar {
            properties {
                property 'sonar.coverage.jacoco.xmlReportPaths', jakartaCoverageReport.get().asFile.absolutePath
            }
        }
    }
}

tasks.named('jacocoTestReport') {
    mustRunAfter(
        tasks.named('test'),
        methodsTest1,
        methodsTest2,
        tckHarnessTest,
        jakartaTck,
        discoverFailingJakartaTck,
        failingJakartaTck,
        singleCoreTck,
        singleJakartaTck
    )
    executionData(fileTree(layout.buildDirectory.dir('jacoco')) {
        include '*.exec'
    })
    dependsOn(jakartaCoverageProjects.collect { it.tasks.named('classes') })
    additionalSourceDirs.from(jakartaCoverageProjects.collect { it.sourceSets.main.allSource.srcDirs })
    sourceDirectories.from(jakartaCoverageProjects.collect { it.sourceSets.main.allSource.srcDirs })
    classDirectories.from(jakartaCoverageProjects.collect { it.sourceSets.main.output })
    reports {
        xml.required = true
        html.required = true
    }
}
